[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "m2html"
version = "0.1.0"
description = "Fast, safe Markdown to HTML rendering powered by Rust."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "m2html contributors" }]
keywords = ["markdown", "html", "rust", "pyo3", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/ecoreal/m2html"
Repository = "https://github.com/ecoreal/m2html"

[tool.maturin]
manifest-path = "crates/m2html-python/Cargo.toml"
module-name = "m2html._native"
python-source = "crates/m2html-python"
features = ["pyo3/extension-module"]
