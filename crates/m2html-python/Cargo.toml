[package]
name = "m2html-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "PyO3 extension module for the m2html Python package."
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin (see [tool.maturin].features) for the Python extension
# build. Keeping it opt-in lets `cargo test` link against libpython so the
# Rust-side binding tests can run.
extension-module = ["pyo3/extension-module"]

[dependencies]
m2html-core.workspace = true
pyo3.workspace = true
tempfile.workspace = true

[dev-dependencies]
# Initialize an embedded interpreter so the Rust-side binding tests can call
# Python APIs without the extension-module feature.
pyo3 = { workspace = true, features = ["auto-initialize"] }
