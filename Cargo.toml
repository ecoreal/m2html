[workspace]
members = [
    "crates/m2html-core",
    "crates/m2html-cli",
    "crates/m2html-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ecoreal/m2html"
homepage = "https://github.com/ecoreal/m2html"
readme = "README.md"
authors = ["m2html contributors"]
keywords = ["markdown", "html", "cli", "python", "rust"]
categories = ["command-line-utilities", "text-processing", "web-programming"]

[workspace.dependencies]
m2html-core = { path = "crates/m2html-core", version = "0.1.0" }
ammonia = "4"
anyhow = "1"
clap = "4"
html-escape = "0.2"
once_cell = "1"
pulldown-cmark = "0.13"
pyo3 = "0.26"
syntect = "5"
thiserror = "2"
walkdir = "2"
