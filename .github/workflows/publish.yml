name: publish

# Publishes m2html-core and m2html to crates.io on a GitHub Release, in
# dependency order, using crates.io Trusted Publishing (OIDC) — no API token
# is stored in the repository or in GitHub secrets.
#
# One-time setup: register a Trusted Publisher on crates.io for both crates
# (crate name -> this repo, workflow file `publish.yml`, environment `publish`).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Mint an OIDC token that cargo exchanges with crates.io at publish time.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Core first: m2html depends on m2html-core at the same version.
      - run: cargo publish -p m2html-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # crates.io needs a moment to expose the new core version to the index.
      - run: sleep 30
      - run: cargo publish -p m2html
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
